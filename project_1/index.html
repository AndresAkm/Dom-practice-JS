<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTA DE TAREAS</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <h1>BIENVENIDO A TU LISTA DE TAREAS</h1>

    <form id="form-tareas">
        <label for="tarea-id"> Escribe tu tarea
            <input type="text" name="tarea" id="tarea-id">
        </label>
        <button class="btn btn-primary p-2" type="submit" id="agregar-tarea-button">Agregar</button>
        <span class="span-error">Error: Inserte un dato</span>
    </form>

    <ol id="lista-tareas">
        <!-- Aqui iran las tareas que se vayan ingresando -->
    </ol>

    <!-- Este span mostrara las tareas pendientes dinamicamente -->
    <p id="tareas-pendientes-p"></p>

    <button data-target="eliminar-todo-modal" data-toggle="modal" id="eliminar-tareas" class="btn btn-danger"> Eliminar todas las tareas </button>

    <div class="modal fade" id="eliminar-todo-modal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">¿Estás seguro de eliminar todas tus tareas?</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    ...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Salir</button>
                    <button type="button" class="btn btn-primary">Eliminar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
